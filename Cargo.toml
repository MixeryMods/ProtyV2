[package]
name = "proty-v2"
version = "0.4.0"
edition = "2021"
description = "Proty V2 — a chess engine whose handcrafted evaluation (tapered material + PSTs + bishop pair) is Texel-tuned on game results from the full modern elite corpus (GM/WGM/IM/WIM/FM/WFM/CM/WCM). No neural net, no engine labels. Anciency-style, modern data."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "proty-v2"
path = "src/main.rs"

[dependencies]
shakmaty = "0.27"
serde_json = "1"
shakmaty-syzygy = "0.25.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
